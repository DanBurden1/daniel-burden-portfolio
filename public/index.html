<!DOCTYPE html>
<html lang="en-GB"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Name | Freelance Professional, Your City</title>
<meta name="description" content="Portfolio of Your Name: recent work, experience and contact details.">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--panel:#fafafa;--chip:#f3f3f3;--text:#111;--muted:#6b6b6b;--line:#e6e6e6;--btn:#161616;--btntext:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--panel:#131313;--chip:#1c1c1c;--text:#f2f2f2;--muted:#9a9a9a;--line:#262626;--btn:#f2f2f2;--btntext:#111;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b0b;--panel:#131313;--chip:#1c1c1c;--text:#f2f2f2;--muted:#9a9a9a;--line:#262626;--btn:#f2f2f2;--btntext:#111;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
.w{max-width:1120px;margin:0 auto;padding:0 24px}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.nav .w{display:flex;align-items:center;height:64px;gap:28px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600}
.dot{width:26px;height:26px;border-radius:50%;background:var(--btn);color:var(--btntext);display:grid;place-items:center;font-size:12px;font-weight:700}
.nav nav{display:flex;gap:26px;color:var(--muted);font-size:15px;flex:1}.nav nav a:hover{color:var(--text)}
.ib{width:36px;height:36px;border-radius:10px;border:0;background:none;font-size:18px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:10px;background:var(--btn);color:var(--btntext);font-weight:500;border:1px solid var(--btn)}
.btn.o{background:var(--bg);color:var(--text);border-color:var(--line)}.btn.s{padding:8px 16px;font-size:15px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding:72px 0 96px}
.pill{display:inline-flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px;color:var(--muted);font-size:14px;margin-bottom:28px}
.pill b{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:1px 10px;font-weight:500}
h1{font-size:clamp(40px,7vw,60px);letter-spacing:-.04em;line-height:1.05;margin:0 0 20px}
.hero p,.about p{color:var(--muted);margin:0 0 16px;max-width:34em}
.acts{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.ph{border-radius:16px;background:linear-gradient(160deg,#1d1d22,#3a2b25 55%,#0e0e10);display:grid;place-items:center;color:#ffffffa0;font-size:14px;aspect-ratio:4/5;width:100%}
.cap{display:flex;justify-content:space-between;color:var(--muted);font-size:15px;margin-top:10px}
section{padding:88px 0;border-top:1px solid var(--line)}
h2{font-size:28px;letter-spacing:-.02em;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 28px}
.seg{display:inline-flex;gap:2px;background:var(--chip);border-radius:10px;padding:3px;margin-bottom:24px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;color:var(--muted);font-size:15px}
.seg button.on{background:var(--bg);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.card{position:relative}.card[hidden]{display:none}
.card .ph{aspect-ratio:4/3;border-radius:14px}
.tag{position:absolute;top:12px;left:12px;background:#ffffffd9;color:#111;border-radius:999px;padding:2px 12px;font-size:14px}
.card .r{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-weight:500}
.card .r span,.card small{color:var(--muted);font-weight:400}.card small{display:block}
.box{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:200px 1fr;gap:24px;padding:22px 26px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.date{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);padding-top:3px}
.row h3{font-size:16px;margin:0 0 6px;font-weight:600}.row h3 span{color:var(--muted);font-weight:400}
.row ul{margin:0;padding-left:20px;color:var(--muted)}.row p{margin:0;color:var(--muted)}
.cells{display:grid;grid-template-columns:repeat(3,1fr)}
.cells div{padding:18px 22px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cells div:nth-child(-n+3){border-top:0}.cells div:nth-child(3n+1){border-left:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:32px}.two h4{margin:0 0 12px;font-weight:500}
.about{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.lead{color:var(--text)!important;font-weight:500;font-size:18px}
.about .ph{aspect-ratio:3/2}
.cta{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:44px;display:grid;grid-template-columns:1fr 1fr;gap:40px}
.cta h2{font-size:32px}.cta p{color:var(--muted);max-width:26em}
.cta dt{color:var(--muted);font-size:15px;margin-top:20px}.cta dt:first-child{margin-top:0}.cta dd{margin:0}
.cta a.l{display:flex;gap:10px;margin-top:6px}.cta a.l span{color:var(--muted)}
.mail{display:flex;gap:8px;margin-top:24px}
footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:14px}
@media(max-width:820px){.hero,.about,.cta,.two{grid-template-columns:1fr}.hero{gap:32px;padding:40px 0 64px}.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr;gap:6px}.cells{grid-template-columns:1fr}.cells div{border-left:0!important;border-top:1px solid var(--line)!important}.cells div:first-child{border-top:0!important}.nav nav a:nth-child(n+3){display:none}.nav nav{gap:18px}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.cta{padding:28px}.nav nav{display:none}.nav .w{justify-content:space-between}}
.ph{overflow:hidden}.ph img{display:block;width:100%;height:100%;object-fit:cover}
.adm{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.adm[hidden]{display:none}
.ab{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
.ab .w{display:flex;align-items:center;gap:12px;height:64px}.ab b{flex:1}.ab small{color:var(--muted)}
.am{max-width:720px;margin:0 auto;padding:28px 24px 80px}
.am label{display:block;font-size:14px;color:var(--muted);margin:14px 0 4px}
.am input:not([type=file]),.am textarea{width:100%;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.am h3{margin:28px 0 4px}.it{border:1px solid var(--line);border-radius:12px;padding:6px 16px 16px;margin:14px 0}
.ih{display:flex;justify-content:space-between;align-items:center;padding-top:10px}
.am button:not(.btn){border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px;font-size:14px}
.up{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.up img{width:64px;height:48px;object-fit:cover;border-radius:6px}
</style>
</head>
<body>
<header class="nav"><div class="w">
<a class="logo" href="#top" id="lg"></a>
<nav><a href="#work">Work</a><a href="#experience">Experience</a><a href="#about">About</a><a href="#contact">Contact</a></nav>
<button class="ib" id="theme" aria-label="Toggle theme">☾</button>
<a class="btn s" href="#contact">Get in touch</a>
</div></header>
<main id="top">
<div class="w hero" id="hero"></div>
<section id="work"><div class="w"><h2>Work</h2><p class="sub">Projects I’ve designed, run or contributed to.</p>
<div class="seg" id="filters"></div><div class="grid" id="cards"></div></div></section>
<section id="experience"><div class="w"><h2>Experience</h2><p class="sub">Credits, education and skills. References available on request.</p>
<div class="seg" id="tabs"><button class="on" data-t="credits">Credits</button><button data-t="edu">Education</button><button data-t="skills">Skills</button></div>
<div id="credits" class="box"></div><div id="edu" class="box" hidden=""></div>
<div id="skills" hidden=""><div class="box cells" id="cells"></div><div class="two" id="chips"></div></div></div></section>
<section id="about"><div class="w about" id="aboutw"></div></section>
<section id="contact"><div class="w"><div class="cta" id="cta"></div></div></section>
</main>
<footer><div class="w">© <span id="yr"></span> <span id="fn"></span> · <a id="al" href="/admin">Admin dashboard</a></div></footer>

<script type="application/json" id="site-data">
{"name":"Daniel Burden","initials":"DB","role":"Daniel Burden | Freelance AVL Designer, Birmingham, UK","now":"Lighting Designer, SJH Christmas Events","intro":["I’m a Lighting and Sound Designer working across the West Midlands."," I’m currently studying Production Arts (Technical) at BOA Stage and Screen.",""],"capL":"Project name","capR":"Category","heroImg":"","work":[{"t":"Project Title One","c":"Design","r":"Your role","y":"2026","img":""},{"t":"Project Title Two","c":"Operation","r":"Your role","y":"2026","img":""},{"t":"Project Title Three","c":"Industry","r":"Crew","y":"2026","img":""},{"t":"Project Title Four","c":"Industry","r":"Training","y":"2026","img":""},{"t":"Project Title Five","c":"Design","r":"Your role","y":"2026","img":""},{"t":"Project Title Six","c":"Operation","r":"Your role","y":"2026","img":""}],"credits":[{"d":"Current","r":"Director","o":"Side Project","b":["Founded and lead this project. Describe what it does.","Add a second highlight."]},{"d":"Sep - Dec 2026","r":"Your Role","o":"Project, Company","b":["Key responsibility one.","Key responsibility two."]},{"d":"Jul 2026 - Present","r":"Casual Crew","o":"Company Name","b":["Describe the work you do."]}],"edu":[{"d":"Sep 2025 - May 2027","t":"Your College or University","x":"Qualification name and highlights."},{"d":"Sep 2020 - Jun 2025","t":"Your School","x":"GCSE or equivalent results."}],"skills":["Time management","Problem-solving","Attention to detail","Communication","Taking direction","Creative ideas"],"chips":[{"t":"Specialist","i":["Skill one","Skill two","Software or kit"]},{"t":"IT","i":["Word","Excel","PowerPoint","Google Workspace"]}],"aboutLead":"I’m a [your profession] working in [your field], based in [your town].","about":["Tell your story: how you got started and what you enjoy most.","Describe what you’re doing now, with recent highlights."],"aboutImg":"","ctaText":"Whether it’s a project, a work placement, a freelance opportunity or just a conversation, I’d love to hear from you.","email":"hello@example.com","based":"Your Town, Your Region. On-site, hybrid or remote.","open":"Productions, events, assistant roles and work placements.","links":[{"n":"Instagram","h":"@yourhandle","u":""},{"n":"LinkedIn","h":"Your Name","u":""},{"n":"GitHub","h":"your-username","u":""}]}
</script>
<script>
var D=JSON.parse(document.getElementById('site-data').textContent),$=function(i){return document.getElementById(i)},can=false,tab='Profile';
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ph(u,t){return '<div class="ph">'+(u?'<img src="'+e(u)+'" alt="">':t)+'</div>'}
function render(){
document.title=D.name+' | '+D.role;
$('lg').innerHTML='<span class="dot">'+e(D.initials)+'</span>'+e(D.name);$('fn').textContent=D.name;
$('hero').innerHTML='<div><a class="pill" href="#work"><b>Now</b>'+e(D.now)+' →</a><h1>'+e(D.name)+'</h1>'+D.intro.map(function(p){return '<p>'+e(p)+'</p>'}).join('')+'<div class="acts"><a class="btn" href="#work">View work</a><a class="btn o" href="#experience">See CV</a></div></div><div>'+ph(D.heroImg,'Your portrait or best photo')+'<div class="cap"><span>'+e(D.capL)+'</span><span>'+e(D.capR)+'</span></div></div>';
var cats=[];D.work.forEach(function(w){if(cats.indexOf(w.c)<0)cats.push(w.c)});
$('filters').innerHTML='<button class="on" data-f="all">All</button>'+cats.map(function(c){return '<button data-f="'+e(c)+'">'+e(c)+'</button>'}).join('');
$('cards').innerHTML=D.work.map(function(w){return '<div class="card" data-c="'+e(w.c)+'">'+ph(w.img,'Project photo')+'<span class="tag">'+e(w.c)+'</span><div class="r">'+e(w.t)+'<span>'+e(w.y)+'</span></div><small>'+e(w.r)+'</small></div>'}).join('');
$('credits').innerHTML=D.credits.map(function(c){return '<div class="row"><div class="date">'+e(c.d)+'</div><div><h3>'+e(c.r)+' <span>· '+e(c.o)+'</span></h3><ul>'+c.b.map(function(b){return '<li>'+e(b)+'</li>'}).join('')+'</ul></div></div>'}).join('');
$('edu').innerHTML=D.edu.map(function(c){return '<div class="row"><div class="date">'+e(c.d)+'</div><div><h3>'+e(c.t)+'</h3><p>'+e(c.x)+'</p></div></div>'}).join('');
$('cells').innerHTML=D.skills.map(function(s){return '<div>'+e(s)+'</div>'}).join('');
$('chips').innerHTML=D.chips.map(function(g){return '<div><h4>'+e(g.t)+'</h4><div class="chips">'+g.i.map(function(i){return '<span>'+e(i)+'</span>'}).join('')+'</div></div>'}).join('');
$('aboutw').innerHTML='<div><h2>About</h2><p class="lead">'+e(D.aboutLead)+'</p>'+D.about.map(function(p){return '<p>'+e(p)+'</p>'}).join('')+'</div>'+ph(D.aboutImg,'Photo');
$('cta').innerHTML='<div><h2>Let’s work together.</h2><p>'+e(D.ctaText)+'</p><div class="mail"><a class="btn" href="mailto:'+e(D.email)+'">✉ '+e(D.email)+'</a><button class="btn o" id="copy" aria-label="Copy email">⧉</button></div></div><dl style="margin:0"><dt>Based in</dt><dd>'+e(D.based)+'</dd><dt>Open to</dt><dd>'+e(D.open)+'</dd><dt>Elsewhere</dt><dd>'+D.links.map(function(l){var u=/^https?:\/\//.test(l.u)?l.u:'#contact';return '<a class="l" href="'+e(u)+'">'+e(l.n)+' <span>'+e(l.h)+'</span></a>'}).join('')+'</dd></dl>';
$('copy').onclick=function(){var b=this;try{navigator.clipboard.writeText(D.email)}catch(x){}b.textContent='✓';setTimeout(function(){b.textContent='⧉'},1500)};
}
(async function(){try{var r=await fetch('/api/content');if(r.ok)D=await r.json()}catch(x){}render()})();
function seg(id,fn){var s=$(id);s.addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;s.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});fn(b)})}
seg('filters',function(b){var f=b.dataset.f;document.querySelectorAll('.card').forEach(function(c){c.hidden=f!=='all'&&c.dataset.c!==f})});
seg('tabs',function(b){['credits','edu','skills'].forEach(function(t){$(t).hidden=t!==b.dataset.t})});
var root=document.documentElement,tb=$('theme');
function dark(){return root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function sync(){tb.textContent=dark()?'☀':'☾'}sync();
tb.onclick=function(){root.dataset.theme=dark()?'light':'dark';sync()};
$('yr').textContent=new Date().getFullYear();

</script></body></html>
